[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sentinel-processor"
version = "0.1.0"
description = "Sentinel-2 L2A downloader with STAC API and Fortran-backed quality validation"
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.10"

keywords = ["sentinel-2", "remote-sensing", "satellite", "stac", "rasterio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pystac-client>=0.7",
    "rioxarray>=0.15",
    "xarray>=2023.1",
    "numpy>=1.24",
    "rasterio>=1.3",
]

[project.optional-dependencies]
netcdf = ["netCDF4>=1.6"]
shapely = ["shapely>=2.0"]
postgis = ["geoalchemy2>=0.14", "shapely>=2.0"]
dev = [
    "pytest>=7.0",
    "netCDF4>=1.6",
]
all = ["netCDF4>=1.6", "shapely>=2.0", "geoalchemy2>=0.14"]

[project.urls]
Repository = "https://github.com/niki8885/sentinel-processor"
Documentation = "https://github.com/niki8885/sentinel-processor/tree/master/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel_processor*"]

[tool.setuptools.package-data]
sentinel_processor = ["validation/fortran/*.f90"]