[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-processor"
version = "0.1.0"
description = "Sentinel-2 L2A downloader with STAC, Fortran-backed validation, spectral indices, and Plotly visualisation"
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.10"

keywords = ["sentinel-2", "remote-sensing", "satellite", "stac", "rasterio", "plotly"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pystac-client>=0.7",
    "rioxarray>=0.15",
    "xarray>=2023.1",
    "numpy>=1.24",
    "rasterio>=1.3",
    "plotly>=5.0",
]

[project.optional-dependencies]
netcdf  = ["netCDF4>=1.6"]
shapely = ["shapely>=2.0"]
postgis = ["geoalchemy2>=0.14", "shapely>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "netCDF4>=1.6",
]
all = ["netCDF4>=1.6", "shapely>=2.0", "geoalchemy2>=0.14"]

[project.urls]
Repository    = "https://github.com/niki8885/sentinel-processor"
Documentation = "https://github.com/niki8885/sentinel-processor/tree/master/docs"

[tool.setuptools.packages.find]
where   = ["."]
include = ["sentinel_processor*"]

[tool.setuptools.package-data]
sentinel_processor = [
    "validation/fortran/*.f90",
    "indices/fortran/*.f90",
    "processing/fortran/*.f90",
    "filters/fortran/*.f90",
    "validation/fortran/*.so",
    "validation/fortran/*.dll",
    "indices/fortran/*.so",
    "indices/fortran/*.dll",
    "processing/fortran/*.so",
    "processing/fortran/*.dll",
    "filters/fortran/*.so",
    "filters/fortran/*.dll",
    "validation/fortran/libgfortran*.dll",
    "validation/fortran/libgcc*.dll",
    "validation/fortran/libwinpthread*.dll",
    "indices/fortran/libgfortran*.dll",
    "indices/fortran/libgcc*.dll",
    "indices/fortran/libwinpthread*.dll",
    "processing/fortran/libgfortran*.dll",
    "processing/fortran/libgcc*.dll",
    "processing/fortran/libwinpthread*.dll",
    "filters/fortran/libgfortran*.dll",
    "filters/fortran/libgcc*.dll",
    "filters/fortran/libwinpthread*.dll",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
markers   = [
    "slow:        mark test as slow (> 1 s)",
    "fortran:     requires compiled Fortran shared library",
    "integration: writes/reads real files via rasterio",
]

[tool.coverage.run]
source = ["sentinel_processor"]
omit   = ["*/fortran/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise FileNotFoundError",
    "if __name__ == .__main__.:",
]