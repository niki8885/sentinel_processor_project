name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build Fortran + run full test suite ───────────────────────────────────
  test:
    name: Test · Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install gfortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran

      - name: Install Python dependencies
        run: pip install -e ".[dev,netcdf]"

      - name: Compile Fortran libraries
        run: |
          set -e
          compile() { gfortran -O2 -shared -fPIC -o "$1" "$2"; }

          compile sentinel_processor/validation/fortran/libsentinel_validation.so \
                   sentinel_processor/validation/fortran/validation.f90

          compile sentinel_processor/indices/fortran/libsentinel_indices.so \
                   sentinel_processor/indices/fortran/indices_mod.f90

          compile sentinel_processor/processing/fortran/libsentinel_raster_ops.so \
                   sentinel_processor/processing/fortran/raster_ops.f90

          compile sentinel_processor/processing/fortran/libsentinel_processing.so \
                   sentinel_processor/processing/fortran/pansharpening.f90

          compile sentinel_processor/processing/fortran/libsentinel_timeseries.so \
                   sentinel_processor/processing/fortran/timeseries_mod.f90

          compile sentinel_processor/filters/fortran/libsentinel_filters.so \
                   sentinel_processor/filters/fortran/filters.f90

          compile sentinel_processor/analysis/fortran/libsentinel_stats.so \
                   sentinel_processor/analysis/fortran/sentinel_stats.f90

          compile sentinel_processor/analysis/fortran/libband_covariance.so \
                   sentinel_processor/analysis/fortran/band_covariance.f90

          compile sentinel_processor/texture/fortran/libsentinel_texture.so \
                   sentinel_processor/texture/fortran/texture_mod.f90

          # NEW: wavelet module
          compile sentinel_processor/wavelet/fortran/libsentinel_wavelet.so \
                   sentinel_processor/wavelet/fortran/wavelet_mod.f90

          # NEW: dl normalisation module
          compile sentinel_processor/dl/fortran/libsentinel_normalize.so \
                   sentinel_processor/dl/fortran/normalize_mod.f90

      - name: Run tests
        run: >-
          pytest tests/ -v --tb=short
          --cov=sentinel_processor
          --cov-report=xml
          --cov-report=term-missing
          --junitxml=junit.xml
          -o junit_family=legacy

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          flags: py${{ matrix.python-version }}

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install ruff
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check sentinel_processor/ tests/

      - name: Verify imports
        run: |
          python -c "import sentinel_processor"
          python -c "from sentinel_processor.indices.compute    import list_indices"
          python -c "from sentinel_processor.filters.compute    import list_filters"
          python -c "from sentinel_processor.visualisation.plot import plot_band"
          python -c "from sentinel_processor.analysis._sentinel_stats_bridge import NODATA"
          python -c "from sentinel_processor.analysis._band_covariance_bridge import band_covariance"
          python -c "from sentinel_processor.texture             import compute_glcm"
          python -c "from sentinel_processor.wavelet._wavelet_bridge import dwt2d, idwt2d, bayes_denoise"
          python -c "from sentinel_processor.dl.normalize import normalize_for_dl, compute_dataset_stats"
          python -c "from sentinel_processor.dl.tiling   import extract_tiles, stitch_tiles"
          python -c "from sentinel_processor.dl.presets  import get_preset, AVAILABLE_PRESETS"