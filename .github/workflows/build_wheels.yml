name: Build wheels

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── macOS: gfortran via Homebrew + create /usr/local/bin/gfortran symlink
      - name: Install gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          # Find the versioned gfortran binary Homebrew installs
          GF=$(ls /usr/local/bin/gfortran-* /opt/homebrew/bin/gfortran-* 2>/dev/null | sort -V | tail -1)
          echo "Found gfortran: $GF"
          # Create symlink so setup.py can find plain 'gfortran'
          sudo ln -sf "$GF" /usr/local/bin/gfortran 2>/dev/null || ln -sf "$GF" /usr/local/bin/gfortran || true
          # Also set env var for setup.py _find_gfortran()
          echo "GFORTRAN_PATH=$GF" >> $GITHUB_ENV
          $GF --version

      # ── Windows: MSYS2 gfortran ───────────────────────────────────────────
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc-fortran

      - name: Add gfortran to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MSYS2_UCRT64_PATH=C:\msys64\ucrt64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ── cibuildwheel ──────────────────────────────────────────────────────
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.19.2
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_SKIP:  "*-win32 *-manylinux_i686 *-musllinux*"
          CIBW_BUILD_VERBOSITY: "1"

          # Linux: install gfortran once per container (before_all)
          CIBW_BEFORE_ALL_LINUX: yum install -y gcc-gfortran || true

          # Test: install runtime deps so imports work
          # Pre-install geo deps as binary wheels before the test venv is created
          CIBW_BEFORE_TEST: >-
            pip install --only-binary :all: numpy rasterio rioxarray pyproj xarray plotly pystac-client || true
          CIBW_TEST_REQUIRES: "numpy rasterio rioxarray xarray plotly pystac-client"
          CIBW_ENVIRONMENT: >-
            PIP_ONLY_BINARY="rasterio:pyproj:numpy:shapely:GDAL"
          CIBW_ENVIRONMENT_WINDOWS: >-
            PIP_ONLY_BINARY="rasterio:pyproj:numpy:shapely:GDAL"
          # macOS: skip --require-archs check since our stub is minimal
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-wheel -w {dest_dir} -v {wheel}"

          CIBW_TEST_COMMAND_LINUX: >-
            bash -c "pip install --only-binary :all: rasterio pyproj rioxarray &&
            python -c \"import sentinel_processor; from sentinel_processor.indices.compute import list_indices; from sentinel_processor.filters.compute import list_filters; print(sorted(list_indices())); print(sorted(list_filters())); print('ALL OK')\""
          CIBW_TEST_COMMAND: >-
            python -c "import sentinel_processor; from sentinel_processor.indices.compute import list_indices; from sentinel_processor.filters.compute import list_filters; print('Indices:', sorted(list_indices())); print('Filters:', sorted(list_filters())); print('ALL OK')"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  # ── Source distribution ───────────────────────────────────────────────────
  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── Twine check ───────────────────────────────────────────────────────────
  check:
    name: twine check
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - run: pip install twine && twine check dist/* && ls -lh dist/

  # ── TestPyPI ──────────────────────────────────────────────────────────────
  upload_testpypi:
    name: Upload to TestPyPI
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # ── PyPI ──────────────────────────────────────────────────────────────────
  upload_pypi:
    name: Upload to PyPI
    needs: upload_testpypi
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true