name: Build wheels

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── macOS: gfortran via Homebrew ─────────────────────────────────────
      - name: Install gfortran (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc

      # ── Windows: MSYS2 gfortran ───────────────────────────────────────────
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc-fortran

      - name: Add gfortran to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MSYS2_UCRT64_PATH=C:\msys64\ucrt64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ── cibuildwheel ──────────────────────────────────────────────────────
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.19.2
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_SKIP:  "*-win32 *-manylinux_i686 *-musllinux*"
          CIBW_BUILD_VERBOSITY: "1"

          # Linux: install gfortran inside manylinux container
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y gcc-gfortran || true

          # macOS: gfortran already installed above
          # Windows: gfortran already on PATH

          # Verify the wheel is platform-specific and Fortran libs are present
          CIBW_TEST_COMMAND: >
            python -c "
            import sys, os
            from pathlib import Path
            import sentinel_processor as sp
            pkg = Path(sp.__file__).parent
            ext = '.dll' if sys.platform == 'win32' else '.so'
            libs = list(pkg.rglob(f'*{ext}'))
            print('Fortran libs found:', [l.name for l in libs])
            assert libs, f'No .so/.dll found in {pkg}'
            from sentinel_processor.indices.compute import list_indices
            from sentinel_processor.filters.compute import list_filters
            print('Indices:', list(list_indices().keys()))
            print('Filters:', list(list_filters().keys()))
            print('OK')
            "

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  # ── Source distribution ───────────────────────────────────────────────────
  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── Twine check ───────────────────────────────────────────────────────────
  check:
    name: twine check
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - name: Run twine check
        run: |
          pip install twine
          twine check dist/*
          ls -lh dist/

  # ── Upload to TestPyPI ────────────────────────────────────────────────────
  upload_testpypi:
    name: Upload to TestPyPI
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # ── Upload to PyPI ────────────────────────────────────────────────────────
  upload_pypi:
    name: Upload to PyPI
    needs: upload_testpypi
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true